[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-flux-pipeline"
version = "0.1.0"
description = "Resolved UV+optical flux pipeline for GALEX+DECaLS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="GALAXEL Team"}]
dependencies = [
  "numpy","scipy","pandas","pyyaml","astropy","astroquery","photutils","reproject","matplotlib","requests"
]

[project.scripts]
galflux = "galaxy_flux_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
